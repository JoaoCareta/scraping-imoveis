# Banco de dados Inove — stack SEPARADO do scraper.
#
# Responsabilidades:
#   - O scraper-api SÓ LÊ imóveis da fonte (Solr). Não toca neste banco.
#   - O n8n é quem GRAVA aqui (cache do catálogo + conversas + avaliações),
#     APÓS ler do scraper.
#   - A cache-api LÊ este banco (e ESCREVE no warm-up de boot — pre-load de clientes).
#
# Rede: usa a rede compartilhada n8n-ww9q_default (criada pelo stack do n8n na VPS,
# /docker/n8n-ww9q) para que n8n e cache-api alcancem o banco pelo nome do container
# (inove-postgres). Para ESTE compose ela é externa: precisa já existir.
#
# ATENÇÃO (migração da VPS antiga): este stack ainda NÃO está no ar na VPS nova
# (srv1800774). No primeiro boot com volume vazio, o postgres aplica o schema.sql
# sozinho (docker-entrypoint-initdb.d). Para trazer os dados antigos
# (cache + conversas + avaliações), restaurar um dump DEPOIS de subir o stack:
#   VPS antiga:  docker exec inove-postgres pg_dump -U inove --clean --if-exists inove > inove.sql
#   VPS nova:    docker exec -i inove-postgres psql -U inove inove < inove.sql
#
# Subir:   cd db && docker compose up -d
# Derrubar: cd db && docker compose down   (NÃO apaga o volume de dados)

services:
  postgres:
    image: postgres:16
    container_name: inove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inove
      POSTGRES_PASSWORD: inove
      POSTGRES_DB: inove
    ports:
      - "127.0.0.1:5432:5432"   # SÓ no host da VPS (psql local) — NUNCA expor 5432 na internet
    volumes:
      - inove_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inove -d inove"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-ww9q_default

# Rede compartilhada (cross-stack) com n8n, Traefik e o stack do scraper. Criada pelo
# stack do n8n (/docker/n8n-ww9q). external: true → precisa já existir.
networks:
  n8n-ww9q_default:
    external: true

# Volume gerenciado por este compose. Na VPS nova não há volume antigo a reaproveitar —
# o schema.sql entra sozinho no primeiro boot; os dados da VPS antiga chegam via dump
# (ver ATENÇÃO no topo).
volumes:
  inove_pgdata:
