services:
  # Scraper — responsabilidade ÚNICA E EXCLUSIVA: fazer o scraping das fontes.
  # NÃO grava em banco, NÃO tem cache. Quem consulta o banco e decide quando chamar
  # este serviço é o n8n (workflows [TOOL] buscar_imoveis e [SYNC] Catalogo imoveis).
  scraper-api:
    build: .
    container_name: scraper-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"   # acesso direto pelo IP:porta (a entrada oficial é o Traefik; ver labels)
    networks:
      - n8n-ww9q_default   # rede compartilhada (cross-stack): n8n e traefik
    # Roteamento público via Traefik (stack em /docker/traefik na VPS; roda em rede host,
    # com exposedbydefault=false → só roteia quem declara traefik.enable=true).
    # traefik.docker.network diz por QUAL rede o Traefik alcança este container.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-ww9q_default"
      - "traefik.http.routers.scraper.rule=Host(`scraper.srv1800774.hstgr.cloud`)"
      - "traefik.http.routers.scraper.entrypoints=websecure"
      - "traefik.http.routers.scraper.tls=true"
      - "traefik.http.routers.scraper.tls.certresolver=letsencrypt"
      - "traefik.http.services.scraper.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# Rede compartilhada (cross-stack) com o n8n e o Traefik. Ela é criada pelo stack do
# n8n (/docker/n8n-ww9q na VPS) — para ESTE compose ela é externa: precisa já existir
# antes de subir. Se o stack do n8n for recriado com outro nome, a rede muda de nome
# e é preciso ajustar aqui e no label traefik.docker.network.
networks:
  n8n-ww9q_default:
    external: true

# Acesso:
#   https://scraper.srv1800774.hstgr.cloud → scraper-api (via Traefik, TLS automático)
#   http://IP:3000                         → acesso direto (porta publicada no host)
# O Postgres é um stack à parte (db/docker-compose.yml) — usado pelo n8n (catálogo,
# chat memory, conversas); o scraper NÃO o acessa.
#
# Ordem de subida (na VPS srv1800774, do zero):
#   1. stack do traefik  (/docker/traefik)   — proxy reverso, provisionado pela Hostinger
#   2. stack do n8n      (/docker/n8n-ww9q)  — cria a rede n8n-ww9q_default
#   3. (cd db && docker compose up -d)       — sobe o Postgres (consumido pelo n8n)
#   4. docker compose up -d --build          — sobe o scraper (SEM --build reusa imagem velha)
