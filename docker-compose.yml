services:
  # Scraper — responsabilidade ÚNICA: LER imóveis da fonte (Solr). NÃO grava em banco.
  scraper-api:
    build: .
    container_name: scraper-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - root_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # API de leitura com cache: LÊ o catálogo no Postgres; cai pro scraper só se vazio.
  # O Postgres NÃO faz parte deste stack — vive em db/docker-compose.yml e é alcançado
  # pela rede root_default, pelo nome do container (inove-postgres).
  cache-api:
    build: .
    container_name: cache-api
    restart: unless-stopped
    command: ["node", "dist/cache-api/main-cache.js"]
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://inove:inove@inove-postgres:5432/inove
      SCRAPER_URL: http://scraper-api:3000
    ports:
      - "3001:3001"
    depends_on:
      - scraper-api
    networks:
      - root_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# Rede compartilhada com o n8n (criada pelo stack do n8n, projeto "root").
# external: true → precisa já existir. Suba o n8n ANTES do scraper.
networks:
  root_default:
    external: true

# A API fica acessível em http://localhost:3000 (scraper) e :3001 (cache) enquanto correr.
# O Postgres agora é um stack à parte (db/docker-compose.yml) — o scraper não o gerencia.
