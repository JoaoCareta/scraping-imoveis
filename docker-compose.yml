services:
  scraper-api:
    build: .
    container_name: scraper-api
    restart: unless-stopped
    env_file: .env
    networks:
      - n8n_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  n8n_net:
    external: true
    name: NOME_DA_REDE_DO_N8N
