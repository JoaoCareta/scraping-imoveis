services:
  scraper-api:
    build: .
    container_name: scraper-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL do atendimento Inove (cache de catálogo, conversas, avaliações).
  # Credenciais LOCAIS DE DEV — trocar em produção (via .env / secrets).
  postgres:
    image: postgres:16
    container_name: inove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inove
      POSTGRES_PASSWORD: inove
      POSTGRES_DB: inove
    ports:
      - "5432:5432"
    volumes:
      - inove_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inove -d inove"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inove_pgdata:

# A API fica acessível em http://localhost:3000 (e na rede local, porta 3000)
# enquanto o container correr.
#
# Para integrar com o n8n no mesmo host, ligar este serviço à rede docker do n8n,
# adicionando ao serviço:
#     networks: [n8n_net]
# e no fim do ficheiro:
#     networks:
#       n8n_net: { external: true, name: NOME_DA_REDE_DO_N8N }
